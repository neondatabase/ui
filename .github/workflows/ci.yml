name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint & format
        run: pnpm check

      - name: Lint markdown
        run: pnpm lint:md

      - name: Typecheck
        run: pnpm typecheck

      - name: Component standard
        run: pnpm verify:components

      - name: Docs theme mirrors the registry tokens
        run: pnpm verify:tokens

      - name: Test
        run: pnpm test

      - name: Build registry
        run: pnpm build:registry

      - name: Registry output is committed
        run: git diff --exit-code packages/registry/public/r

      - name: Build docs
        run: pnpm build:docs

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate PR commits
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
